<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Лис в лесу — голодная охота</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Название и описание — наверху, над окном игры -->
  <header id="game-header">
    <h1 id="game-title">Лис в лесу</h1>
    <p id="game-desc">Поймайте как можно больше мышей, пока не проголодались окончательно!</p>
  </header>

  <div id="game-container">
    <canvas id="game-canvas" width="800" height="480"></canvas>

    <div id="hud-top">
      <div id="hud-left">
        <span id="hud-score">🐭 Съедено: 0</span>
      </div>
      <div id="hud-right">
        <span id="hud-best">🏆 Рекорд: 0</span>
        <button id="pause-btn">Пауза</button>
      </div>
    </div>

    <div id="hunger-wrap">
      <div id="hunger-label">Сытость: 100%</div>
      <div id="hunger-bar">
        <div id="hunger-fill"></div>
      </div>
    </div>

    <div id="state-banner"></div>

    <!-- Оверлей только для проигрыша -->
    <div id="overlay" class="hidden">
      <h1 id="overlay-title"></h1>
      <p id="overlay-text"></p>
      <button id="new-game-btn">Новая игра</button>
    </div>
  </div>

  <!-- Кнопка запуска — под окном с игрой -->
  <div id="start-row">
    <button id="start-btn">Начать игру</button>
  </div>

  <p class="hint">WASD / стрелки — движение &nbsp;|&nbsp; Space — прыжок &nbsp;|&nbsp; P — пауза &nbsp;|&nbsp; R — новая игра</p>

  <!-- Порядок скриптов важен: World -> Collision -> Player -> Renderer -> Game -> main -->
  <script src="js/World.js"></script>
  <script src="js/Collision.js"></script>
  <script src="js/Player.js"></script>
  <script src="js/InputHandler.js"></script>
  <script src="js/Renderer.js"></script>
  <script src="js/Game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
